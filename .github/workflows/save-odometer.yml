
name: Save Hyundai Odometer
on:
  workflow_dispatch:
  schedule:
    - cron: "15 2 * * *"
      timezone: "Europe/Stockholm"

jobs:
  save-odometer:
    runs-on: ubuntu-latest

    steps:
      - name: Hämta repository
        uses: actions/checkout@v4

      - name: Installera Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installera bibliotek
        run: |
          pip install hyundai-kia-connect-api
          pip install requests

      - name: Hämta och spara mätarställning
        run: python save_odometer.py
        env:
          HYUNDAI_USERNAME: ${{ secrets.HYUNDAI_USERNAME }}
          HYUNDAI_PASSWORD: ${{ secrets.HYUNDAI_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
